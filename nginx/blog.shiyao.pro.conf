# blog.shiyao.pro —— 静态子站 (HTTPS)
# 阿里云免费证书,有效期至 2026-08-29,到期前需手动续期重新部署
# 内容发布方式: 把 *.html 丢进 /var/www/blog.shiyao.pro/ 即可访问
#   - 例: /var/www/blog.shiyao.pro/foo.html  ->  https://blog.shiyao.pro/foo

server {
    listen       80;
    listen       [::]:80;
    server_name  blog.shiyao.pro;
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  blog.shiyao.pro;

    ssl_certificate     /etc/nginx/ssl/blog.shiyao.pro.pem;
    ssl_certificate_key /etc/nginx/ssl/blog.shiyao.pro.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 安全相关响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    root  /var/www/blog.shiyao.pro;
    index index.html;
    charset utf-8;

    # gzip 压缩
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # 主入口: /foo 自动找 /foo.html, /bar/ 找 /bar/index.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # HTML 不缓存(发布后立即可见)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 静态资源(图片/字体/CSS/JS)长缓存
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 屏蔽隐藏文件(. 开头的目录文件)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 屏蔽备份/临时文件 (防御性,即使误同步到 webroot 也访问不到)
    location ~* \.(bak|orig|tmp|swp|swo)(\..+)?$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
